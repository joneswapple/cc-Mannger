{{define "content"}}
<section class="login">
  <h1>Sign in</h1>
  {{if .Flash}}<p class="error">{{.Flash}}</p>{{end}}
  <form method="post" action="/admin/login{{if .Next}}?next={{.Next}}{{end}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Admin token<input name="token" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">Lost the token? Stop the server and run <code>cliproxy admin reset-token</code> to install a new one.</p>
</section>
{{end}}
